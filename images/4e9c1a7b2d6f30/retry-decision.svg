<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">再送時の判断</title>
  <desc id="desc">同じ冪等性キーの状態を確認し、completedなら結果を返し、pendingなら待ち、timeoutなら失敗表示して利用者の明示操作を待つ判断フロー</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <filter id="shadow" x="-12%" y="-20%" width="124%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.09"/></filter>
    <style>.title{font:700 34px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#0f172a}.label{font:700 21px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#0f172a}.note{font:500 16px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#475569}.edge{font:700 15px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#475569}</style>
  </defs>
  <rect width="1200" height="660" fill="#f8fafc"/>
  <text x="600" y="58" text-anchor="middle" class="title">再送時の判断</text>

  <rect x="430" y="95" width="340" height="88" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="132" text-anchor="middle" class="label">同じ冪等性キーで再送</text><text x="600" y="160" text-anchor="middle" class="note">DBの状態を確認</text>
  <line x1="600" y1="183" x2="600" y2="245" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <polygon points="600,250 760,340 600,430 440,340" fill="#fff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="335" text-anchor="middle" class="label">現在の状態は？</text>

  <line x1="440" y1="340" x2="285" y2="340" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><text x="362" y="322" text-anchor="middle" class="edge">completed</text>
  <rect x="55" y="285" width="220" height="110" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="165" y="330" text-anchor="middle" class="label">結果を返す</text><text x="165" y="360" text-anchor="middle" class="note">画像APIは呼ばない</text>

  <line x1="760" y1="340" x2="915" y2="340" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><text x="838" y="322" text-anchor="middle" class="edge">pending</text>
  <rect x="925" y="285" width="220" height="110" rx="18" fill="#fff7ed" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="1035" y="330" text-anchor="middle" class="label">409で待つ</text><text x="1035" y="360" text-anchor="middle" class="note">Retry-After: 10</text>

  <line x1="600" y1="430" x2="600" y2="492" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><text x="655" y="468" class="edge">failed</text>
  <rect x="420" y="502" width="360" height="110" rx="18" fill="#fef2f2" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="546" text-anchor="middle" class="label">自動再生成しない</text><text x="600" y="577" text-anchor="middle" class="note">利用者の「もう一度つくる」で新attempt</text>

  <path d="M1035 395V565H790" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="1000" y="548" text-anchor="middle" class="note">古いpendingはfailedへ</text>
</svg>
