<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">外部処理をDB transactionで囲まない</title>
  <desc id="desc">PostgreSQLで画像APIを呼ぶrequestを1つに絞り、画像APIとBlob保存をtransaction外で実行し、最後に生成ログとcompletedを短いtransactionで確定する流れ</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#059669"/></marker>
    <filter id="shadow" x="-12%" y="-20%" width="124%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/></filter>
    <style>
      .title{font:700 34px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#0f172a}.label{font:700 20px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#0f172a}.note{font:500 15px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#475569}.phase{font:700 17px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.small{font:600 14px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#64748b}
    </style>
  </defs>
  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="600" y="58" text-anchor="middle" class="title">外部処理をDB transactionで囲まない</text>

  <rect x="40" y="115" width="1120" height="290" rx="24" fill="#fff" stroke="#cbd5e1" filter="url(#shadow)"/>

  <rect x="70" y="185" width="160" height="105" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="150" y="228" text-anchor="middle" class="label">Browser</text><text x="150" y="258" text-anchor="middle" class="note">生成request</text>
  <line x1="230" y1="238" x2="275" y2="238" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="285" y="165" width="190" height="145" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="380" y="211" text-anchor="middle" class="label">PostgreSQL</text><text x="380" y="242" text-anchor="middle" class="note">画像APIを呼ぶ1件を選ぶ</text><text x="380" y="270" text-anchor="middle" class="note">pendingを保存</text>
  <line x1="475" y1="238" x2="520" y2="238" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="530" y="185" width="160" height="105" rx="16" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="610" y="228" text-anchor="middle" class="label">画像API</text><text x="610" y="258" text-anchor="middle" class="note">遅い外部処理</text>
  <line x1="690" y1="238" x2="735" y2="238" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="745" y="185" width="160" height="105" rx="16" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="825" y="228" text-anchor="middle" class="label">Vercel Blob</text><text x="825" y="258" text-anchor="middle" class="note">画像を保存</text>
  <line x1="905" y1="238" x2="950" y2="238" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="960" y="165" width="170" height="145" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="1045" y="205" text-anchor="middle" class="label">PostgreSQL</text><text x="1045" y="236" text-anchor="middle" class="note">生成ログを保存</text><text x="1045" y="264" text-anchor="middle" class="note">completedへ更新</text>

  <path d="M285 330V350H475V330" fill="none" stroke="#059669" stroke-width="3"/>
  <text x="380" y="372" text-anchor="middle" class="phase" fill="#047857">短いtransaction</text>

  <path d="M530 330V350H905V330" fill="none" stroke="#d97706" stroke-width="3"/>
  <text x="718" y="372" text-anchor="middle" class="phase" fill="#b45309">DB transactionの外</text>

  <path d="M960 330V350H1130V330" fill="none" stroke="#059669" stroke-width="3"/>
  <text x="1045" y="372" text-anchor="middle" class="phase" fill="#047857">短いtransaction</text>

  <rect x="105" y="450" width="990" height="135" rx="22" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="155" y="488" class="phase" fill="#1d4ed8">同じ冪等性キーで再送されたら</text>
  <rect x="155" y="510" width="245" height="50" rx="12" fill="#fff" stroke="#93c5fd"/><text x="278" y="542" text-anchor="middle" class="note">PostgreSQLの状態を確認</text>
  <line x1="400" y1="535" x2="500" y2="535" stroke="#059669" stroke-width="3" marker-end="url(#arrow-green)"/>
  <rect x="510" y="510" width="245" height="50" rx="12" fill="#fff" stroke="#6ee7b7"/><text x="633" y="542" text-anchor="middle" class="note">completedなら結果を取得</text>
  <line x1="755" y1="535" x2="855" y2="535" stroke="#059669" stroke-width="3" marker-end="url(#arrow-green)"/>
  <rect x="865" y="510" width="180" height="50" rx="12" fill="#fff" stroke="#6ee7b7"/><text x="955" y="542" text-anchor="middle" class="note">外部APIは呼ばない</text>
</svg>
