<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
  <title id="title">画像生成requestの3状態</title>
  <desc id="desc">pending、completed、failedの状態遷移と、再送または明示再生成の関係</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.1"/></filter>
    <style>.title{font:700 34px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#0f172a}.state{font:700 26px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#0f172a}.note{font:500 17px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#475569}.edge{font:600 16px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#475569}</style>
  </defs>
  <rect width="1100" height="600" fill="#f8fafc"/>
  <text x="550" y="60" text-anchor="middle" class="title">画像生成requestの3状態</text>

  <circle cx="90" cy="275" r="16" fill="#64748b"/>
  <line x1="106" y1="275" x2="245" y2="275" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="175" y="252" text-anchor="middle" class="edge">冪等性キーを保存</text>

  <rect x="255" y="205" width="220" height="140" rx="24" fill="#fff7ed" stroke="#fb923c" stroke-width="2" filter="url(#shadow)"/>
  <text x="365" y="265" text-anchor="middle" class="state">pending</text><text x="365" y="300" text-anchor="middle" class="note">画像APIを呼び出し中</text>

  <line x1="475" y1="245" x2="680" y2="155" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="565" y="174" text-anchor="middle" class="edge">Blob・DB保存まで成功</text>
  <rect x="690" y="90" width="260" height="140" rx="24" fill="#ecfdf5" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="820" y="150" text-anchor="middle" class="state">completed</text><text x="820" y="185" text-anchor="middle" class="note">保存済み結果を返す</text>

  <line x1="475" y1="305" x2="680" y2="415" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="565" y="382" text-anchor="middle" class="edge">失敗 / timeout</text>
  <rect x="690" y="370" width="260" height="140" rx="24" fill="#fef2f2" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="820" y="430" text-anchor="middle" class="state">failed</text><text x="820" y="465" text-anchor="middle" class="note">理由はfailureCodeへ</text>

  <path d="M690 490C520 570 285 510 285 355" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <rect x="285" y="495" width="340" height="42" rx="12" fill="#f8fafc"/>
  <text x="455" y="522" text-anchor="middle" class="edge">画像APIを呼ぶ前の失敗だけretry可</text>
  <text x="820" y="555" text-anchor="middle" class="note">明示再生成は新しいgenerationAttempt</text>
</svg>
