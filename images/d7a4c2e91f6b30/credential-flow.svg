<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">認証情報を3つに分ける</title>
  <desc id="desc">アプリ用Secret、ローカルCLI、CI用の認証情報を、それぞれ別の経路と保存先で扱う図</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d97706"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; fill: #0f172a; }
      .row-label { font: 700 21px -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; }
      .box-title { font: 700 20px -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; fill: #0f172a; }
      .box-note { font: 500 16px -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; fill: #475569; }
      .arrow-label { font: 600 14px -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="600" y="60" text-anchor="middle" class="title">認証情報を3つに分ける</text>

  <!-- アプリ用Secret -->
  <rect x="40" y="100" width="1120" height="160" rx="22" fill="#eff6ff" stroke="#bfdbfe" filter="url(#shadow)"/>
  <rect x="62" y="122" width="170" height="116" rx="16" fill="#dbeafe"/>
  <text x="147" y="174" text-anchor="middle" class="row-label" fill="#1d4ed8">アプリ用</text>
  <text x="147" y="203" text-anchor="middle" class="row-label" fill="#1d4ed8">Secret</text>

  <rect x="270" y="130" width="205" height="100" rx="14" fill="#ffffff" stroke="#93c5fd"/>
  <text x="372" y="173" text-anchor="middle" class="box-title">macOS Keychain</text>
  <text x="372" y="201" text-anchor="middle" class="box-note">手元の投入元</text>

  <line x1="475" y1="180" x2="535" y2="180" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="505" y="161" text-anchor="middle" class="arrow-label">人が投入</text>

  <rect x="545" y="130" width="240" height="100" rx="14" fill="#ffffff" stroke="#93c5fd"/>
  <text x="665" y="173" text-anchor="middle" class="box-title">VercelのSecretストア</text>
  <text x="665" y="201" text-anchor="middle" class="box-note">Preview / Production</text>

  <line x1="785" y1="180" x2="845" y2="180" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="815" y="161" text-anchor="middle" class="arrow-label">実行時</text>

  <rect x="855" y="130" width="260" height="100" rx="14" fill="#ffffff" stroke="#93c5fd"/>
  <text x="985" y="173" text-anchor="middle" class="box-title">アプリ</text>
  <text x="985" y="201" text-anchor="middle" class="box-note">OpenAI API / Neon DB</text>

  <!-- ローカルCLI -->
  <rect x="40" y="280" width="1120" height="160" rx="22" fill="#ecfdf5" stroke="#a7f3d0" filter="url(#shadow)"/>
  <rect x="62" y="302" width="170" height="116" rx="16" fill="#d1fae5"/>
  <text x="147" y="354" text-anchor="middle" class="row-label" fill="#047857">ローカル</text>
  <text x="147" y="383" text-anchor="middle" class="row-label" fill="#047857">CLI</text>

  <rect x="270" y="310" width="205" height="100" rx="14" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="372" y="353" text-anchor="middle" class="box-title">自分</text>
  <text x="372" y="381" text-anchor="middle" class="box-note">対話操作</text>

  <line x1="475" y1="360" x2="535" y2="360" stroke="#059669" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="505" y="341" text-anchor="middle" class="arrow-label">login</text>

  <rect x="545" y="310" width="240" height="100" rx="14" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="665" y="348" text-anchor="middle" class="box-title">各サービスのCLI</text>
  <text x="665" y="378" text-anchor="middle" class="box-note">vercel / neon / wrangler</text>

  <line x1="785" y1="360" x2="845" y2="360" stroke="#059669" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="815" y="341" text-anchor="middle" class="arrow-label">操作</text>

  <rect x="855" y="310" width="260" height="100" rx="14" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="985" y="345" text-anchor="middle" class="box-title">Vercel / Neon /</text>
  <text x="985" y="373" text-anchor="middle" class="box-title">Cloudflare</text>
  <text x="985" y="399" text-anchor="middle" class="box-note">Project / Accountの管理</text>

  <!-- CI用 -->
  <rect x="40" y="460" width="1120" height="160" rx="22" fill="#fff7ed" stroke="#fed7aa" filter="url(#shadow)"/>
  <rect x="62" y="482" width="170" height="116" rx="16" fill="#ffedd5"/>
  <text x="147" y="534" text-anchor="middle" class="row-label" fill="#c2410c">CI用</text>
  <text x="147" y="563" text-anchor="middle" class="row-label" fill="#c2410c">認証情報</text>

  <rect x="270" y="490" width="205" height="100" rx="14" fill="#ffffff" stroke="#fdba74"/>
  <text x="372" y="533" text-anchor="middle" class="box-title">CI専用トークン</text>
  <text x="372" y="561" text-anchor="middle" class="box-note">用途と権限を絞る</text>

  <line x1="475" y1="540" x2="535" y2="540" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <text x="505" y="521" text-anchor="middle" class="arrow-label">保存</text>

  <rect x="545" y="490" width="240" height="100" rx="14" fill="#ffffff" stroke="#fdba74"/>
  <text x="665" y="528" text-anchor="middle" class="box-title">GitHub Environment</text>
  <text x="665" y="555" text-anchor="middle" class="box-title">Secrets</text>
  <text x="665" y="579" text-anchor="middle" class="box-note">環境ごとに分離</text>

  <line x1="785" y1="540" x2="845" y2="540" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <text x="815" y="521" text-anchor="middle" class="arrow-label">自動処理</text>

  <rect x="855" y="490" width="260" height="100" rx="14" fill="#ffffff" stroke="#fdba74"/>
  <text x="985" y="528" text-anchor="middle" class="box-title">GitHub Actions</text>
  <text x="985" y="557" text-anchor="middle" class="box-note">Vercel / Neon / Cloudflare</text>
  <text x="985" y="581" text-anchor="middle" class="box-note">deploy / Terraform</text>
</svg>
